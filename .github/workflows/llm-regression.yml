
name: LLM Regression CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline Regression Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate baseline checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("baselines/v1_dataset_v3_30_checkpoint.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data["results"]
          ids = [str(row["test_id"]) for row in rows]

          assert len(rows) == 30, "Expected 30 baseline cases"
          assert len(set(ids)) == 30, "Duplicate test IDs detected"

          print("Baseline validation passed: 30 unique cases")
          PY

      - name: Compile Python source files
        run: |
          python -m compileall -q src

      - name: Test monitoring drift detection
        run: |
          python - <<'PY'
          from src.monitoring import evaluate_drift

          def history(scores):
              return [
                  {
                      "run_id": str(i),
                      "dataset_id": "v3",
                      "total_cases": 30,
                      "accuracy_percent": score,
                  }
                  for i, score in enumerate(scores, 1)
              ]

          stable = evaluate_drift(
              history([100, 98, 97, 95, 93, 90, 88]),
              7, 92.0, 7
          )
          assert stable["status"] == "STABLE"

          drifting = evaluate_drift(
              history([96, 94, 91, 89, 87, 85, 82]),
              7, 92.0, 7
          )
          assert drifting["status"] == "SLOW_DRIFT"

          insufficient = evaluate_drift(
              history([96, 94, 90]), 7, 92.0, 7
          )
          assert insufficient["status"] == "INSUFFICIENT_HISTORY"

          print("All three drift tests passed")
          PY

  live-evaluation:
    name: Live Groq Evaluation
    if: github.event_name == 'workflow_dispatch'
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run 30-case LLM evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVALUATION_CHECKPOINT_PATH: evaluations/ci_v2_checkpoint.json
        run: |
          mkdir -p evaluations
          python src/evaluation_runner.py

      - name: Verify evaluation checkpoint
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("evaluations/ci_v2_checkpoint.json")
          assert path.is_file(), "CI evaluation checkpoint missing"

          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data["results"]
          ids = [str(row["test_id"]) for row in rows]

          assert len(rows) == 30, f"Expected 30 cases, got {len(rows)}"
          assert len(set(ids)) == 30, "Duplicate test IDs detected"

          print("Live evaluation completed: 30 unique cases")
          PY

      - name: Compare baseline and candidate
        run: |
          python src/regression_comparator.py \
            --baseline baselines/v1_dataset_v3_30_checkpoint.json \
            --candidate evaluations/ci_v2_checkpoint.json \
            --baseline-dataset datasets/golden_dataset_v3.json \
            --candidate-dataset datasets/golden_dataset_v3.json \
            --output evaluations/ci_regression_comparison.json

      - name: Run quality gate
        run: |
          python src/quality_gate.py \
            --baseline baselines/v1_dataset_v3_30_checkpoint.json \
            --candidate evaluations/ci_v2_checkpoint.json \
            --output evaluations/ci_quality_gate.json

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-results
          path: |
            evaluations/ci_v2_checkpoint.json
            evaluations/ci_regression_comparison.json
            evaluations/ci_quality_gate.json
          if-no-files-found: warn
          retention-days: 7
